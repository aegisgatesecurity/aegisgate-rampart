name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================
  # DCO enforcement — every commit must be signed off
  # ========================================
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all commits
        run: |
          echo "## DCO Verification" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          # Check all commits in the push (get full commit message with body)
          # Skip commits from known bots (Dependabot, GitHub Actions, etc.)
          while IFS= read -r hash; do
            # Get full commit message including body
            FULL_MSG=$(git log --format="%B" -1 $hash)
            SUBJECT=$(git log --format="%s" -1 $hash)
            AUTHOR=$(git log --format="%an" -1 $hash)
            
            # Skip commits from known bots
            if echo "$AUTHOR" | grep -qiE "(dependabot|github-actions|renovate)"; then
              echo "⏭️  Skipped (bot): $SUBJECT" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            
            if ! echo "$FULL_MSG" | grep -q "Signed-off-by:"; then
              echo "❌ Missing Signed-off-by: $SUBJECT" >> $GITHUB_STEP_SUMMARY
              MISSING=$((MISSING + 1))
            else
              SIGNOFF=$(echo "$FULL_MSG" | grep "Signed-off-by:" | head -1)
              echo "✅ Signed-off: $SUBJECT" >> $GITHUB_STEP_SUMMARY
              echo "   $SIGNOFF" >> $GITHUB_STEP_SUMMARY
            fi
          done < <(git log --format="%H" HEAD^..HEAD 2>/dev/null || git log --format="%H" -1)
          if [ $MISSING -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$MISSING commit(s) missing Signed-off-by**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please amend commits with: git commit --amend --signoff" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All commits have Signed-off-by** ✅" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # Lint — golangci-lint + go vet + gofmt
  # ========================================
  lint:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "UNFORMATTED: $out"; exit 1; fi

  # ========================================
  # Test — unit tests + 80% coverage floor
  # ========================================
  test:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Run tests (non-CGO)
        run: CGO_ENABLED=0 go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check total coverage ≥ 79%
        run: |
          # Exclude inherently untestable packages from the total coverage check
          # cmd/rampart: main entry points + daemon (requires system tray/network)
          # internal/tray: requires running GUI environment (systray/CGO)
          # cmd/rampart-lsp: LSP server entry point (requires stdio/IDE)
          # internal/autostart: OS-specific auto-start (launchd/SystemD/Registry)
          # internal/catrust: certificate trust store (platform-specific, Windows/Darwin)
          EXCLUDE_PKGS="github.com/aegisgatesecurity/aegisgate-rampart/cmd/rampart,github.com/aegisgatesecurity/aegisgate-rampart/internal/tray,github.com/aegisgatesecurity/aegisgate-rampart/cmd/rampart-lsp,github.com/aegisgatesecurity/aegisgate-rampart/internal/autostart,github.com/aegisgatesecurity/aegisgate-rampart/internal/catrust"
          
          # Generate coverage excluding untestable packages
          go test -coverprofile=coverage-filtered.out -covermode=atomic $(go list ./... | grep -v -E "$(echo $EXCLUDE_PKGS | sed 's/,/|/g')")
          TOTAL=$(go tool cover -func=coverage-filtered.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage (excluding untestable packages): ${TOTAL}%"
          PASS=$(echo "$TOTAL >= 79" | bc)
          if [ "$PASS" != "1" ]; then echo "FAIL: coverage ${TOTAL}% < 79%"; exit 1; fi
          
          # Also show full coverage for reference
          go test -coverprofile=coverage.out -covermode=atomic ./... 2>/dev/null || true
          FULL_TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Full coverage (all packages): ${FULL_TOTAL}%"
      - name: Check per-package coverage ≥ 80%
        run: |
          # Exempt packages that are inherently untestable in CI
          # (main entry points, GUI/system tray, platform-specific OS stubs)
          EXEMPT="cmd/rampart,internal/tray,cmd/rampart-lsp,internal/autostart,internal/catrust,internal/verify"
          go tool cover -func=coverage.out | grep -v total | while read pkg func cov; do
            PCT=$(echo "$cov" | tr -d '%')
            SKIP=0
            for e in $(echo "$EXEMPT" | tr ',' ' '); do
              if echo "$pkg" | grep -q "$e"; then SKIP=1; fi
            done
            if [ "$SKIP" = "0" ]; then
              PASS=$(echo "$PCT >= 80.0" | bc)
              if [ "$PASS" != "1" ]; then echo "LOW COV: $pkg $func ${PCT}%"; fi
            fi
          done
      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out

  # ========================================
  # Cross-compile — verify Windows + macOS builds
  # ========================================
  cross-compile:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Cross-compile for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart-windows.exe ./cmd/rampart/
          ls -lh rampart-windows.exe
      - name: Cross-compile for Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart-linux-arm64 ./cmd/rampart/
          ls -lh rampart-linux-arm64
      - name: Windows go vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: GOOS=windows GOARCH=amd64 go vet ./...

  # ========================================
  # macOS build + test — CGO_ENABLED=1 (systray requires Objective-C)
  # ========================================
  macos:
    needs: dco
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Run tests (CGO_ENABLED=1)
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./...
      - name: go vet
        run: go vet ./...
      - name: Build binary (CGO_ENABLED=1)
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart ./cmd/rampart/
          ls -lh rampart
      - name: Verify binary runs
        run: ./rampart version

  # ========================================
  # Windows — build and vet (no CGO needed)
  # ========================================
  windows:
    needs: dco
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Run tests (CGO_ENABLED=0)
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Build binary
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart.exe ./cmd/rampart/
          ls rampart.exe
      - name: Verify binary runs
        run: .\rampart.exe version

  # ========================================
  # Build — verify binary compiles (both CGO and non-CGO)
  # ========================================
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cgo: [0, 1]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Install ONNX Runtime v1.29.0 (CGO builds only)
        if: matrix.cgo == 1
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
          tar -xzf onnxruntime-linux-x64-1.29.0.tgz
          sudo cp onnxruntime-linux-x64-1.29.0/lib/*.so /usr/lib/
          sudo cp -r onnxruntime-linux-x64-1.29.0/include/* /usr/include/
          rm -rf onnxruntime-linux-x64-1.29.0.tgz onnxruntime-linux-x64-1.29.0
      - name: Build binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CGO_CFLAGS: ${{ matrix.cgo == 1 && '-I/usr/include' || '' }}
          CGO_LDFLAGS: ${{ matrix.cgo == 1 && '-L/usr/lib -lonnxruntime' || '' }}
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart ./cmd/rampart/
          ls -lh rampart
      - name: Verify binary runs
        run: ./rampart version

  # ========================================
  # ML tests — CGO-enabled tests with ONNX Runtime + model
  # Verifies detection parity: neural model loads and scores threats correctly.
  # ========================================
  ml-test:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Install ONNX Runtime v1.29.0
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
          tar -xzf onnxruntime-linux-x64-1.29.0.tgz
          sudo cp onnxruntime-linux-x64-1.29.0/lib/*.so /usr/lib/
          sudo cp -r onnxruntime-linux-x64-1.29.0/include/* /usr/include/
          sudo ldconfig
          rm -rf onnxruntime-linux-x64-1.29.0.tgz onnxruntime-linux-x64-1.29.0
      - name: Run ML tests (CGO_ENABLED=1)
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I/usr/include"
          CGO_LDFLAGS: "-L/usr/lib -lonnxruntime"
          LD_LIBRARY_PATH: /usr/lib
        run: |
          go test -v -count=1 -timeout 120s ./pkg/detector/ ./internal/ml/
      - name: Run evasion suite (gate — must score ≥95/100)
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I/usr/include"
          CGO_LDFLAGS: "-L/usr/lib -lonnxruntime"
          LD_LIBRARY_PATH: /usr/lib
          AEGISGATE_ML_MODEL_PATH: ${{ github.workspace }}/models/threat_cnn_bilstm.onnx
        run: |
          go test -v -count=1 -timeout 600s -tags=cgo -run TestEvasionSuite ./internal/detectors/ 2>&1 | tee /tmp/evasion-results.txt
          SCORE=$(grep "Evasion Resistance Score" /tmp/evasion-results.txt | grep -oP '[\d.]+/100' | cut -d/ -f1)
          echo "Evasion Resistance Score: $SCORE/100"
          if awk -v score="$SCORE" 'BEGIN { exit (score < 95.0) ? 1 : 0 }'; then
            echo "✅ Evasion suite PASSED (score: $SCORE/100)"
          else
            echo "❌ Evasion suite FAILED (score: $SCORE/100, threshold: 95.0)"
            exit 1
          fi