name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================
  # DCO enforcement — every commit must be signed off
  # ========================================
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all commits
        run: |
          echo "## DCO Verification" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          # For PRs: check all commits between base and head (strict enforcement)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%H" origin/${{ github.base_ref }}..HEAD)
            STRICT=1
          else
            # For pushes/schedule: check the latest commit only
            COMMITS=$(git log --format="%H" -1)
            STRICT=0
          fi
          for COMMIT in $COMMITS; do
            AUTHOR=$(git log --format="%an" -1 $COMMIT)
            EMAIL=$(git log --format="%ae" -1 $COMMIT)
            SUBJECT=$(git log --format="%s" -1 $COMMIT)
            # Exempt bot authors (dependabot, renovate, etc.) from DCO
            if echo $AUTHOR | grep -qiE '(dependabot|renovate|github-actions)[bot]$|bot$' || echo $EMAIL | grep -qiE '(dependabot|renovate|github-actions)[bot]|bot@|\[bot\]'; then
              echo "⏭️ Skipping DCO for bot commit: $SUBJECT ($AUTHOR)" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            # Exempt merge commits (commits with 2+ parents - created by GitHub merge UI)
            PARENT_COUNT=$(git rev-list --parents -1 $COMMIT | wc -w) || true
            if [ "$PARENT_COUNT" -gt 2 ]; then
              echo "⏭️ Skipping DCO for merge commit: $SUBJECT" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            FULL_MSG=$(git log --format="%B" -1 $COMMIT)
            if ! echo "$FULL_MSG" | grep -q "Signed-off-by:"; then
              echo "❌ Missing Signed-off-by: $SUBJECT ($AUTHOR <$EMAIL>)" >> $GITHUB_STEP_SUMMARY
              echo "   Fix: git commit --amend -s" >> $GITHUB_STEP_SUMMARY
              MISSING=1
            else
              SIGNOFF=$(echo "$FULL_MSG" | grep "Signed-off-by:" | head -1)
              echo "✅ Signed-off: $SUBJECT" >> $GITHUB_STEP_SUMMARY
              echo "   $SIGNOFF" >> $GITHUB_STEP_SUMMARY
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please amend commits with: git commit --amend --signoff" >> $GITHUB_STEP_SUMMARY
            if [ "$STRICT" -eq 1 ]; then
              echo "❌ DCO check failed — all PR commits must include Signed-off-by" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "⚠️ DCO advisory: commits without Signed-off-by detected" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**All commits have Signed-off-by** ✅" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================
  # Lint — golangci-lint + go vet + gofmt
  # ========================================
  lint:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "UNFORMATTED: $out"; exit 1; fi

  # ========================================
  # Test — unit tests + 85% coverage floor
  # ========================================
  test:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Run tests (non-CGO)
        run: CGO_ENABLED=0 go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check total coverage ≥ 85%
        run: |
          # Exclude inherently untestable packages from the total coverage check
          # cmd/rampart: main entry points + daemon (requires system tray/network)
          # internal/tray: requires running GUI environment (systray/CGO)
          # cmd/rampart-lsp: LSP server entry point (requires stdio/IDE)
          # internal/autostart: OS-specific auto-start (launchd/SystemD/Registry)
          # internal/catrust: certificate trust store (platform-specific, Windows/Darwin)
          # internal/verify: signature verification (requires code-signing certs)
          # internal/notify: desktop notifications (platform-specific Darwin/Windows)
          # internal/platform: OS path helpers (platform-specific, minimal logic)
          #
          # v0.10.1: threshold raised 75→85% after comprehensive test coverage:
          #   - Multi-turn detector (30 functions, internal/ml)
          #   - Context tracking (4 functions, internal/ml)
          #   Audit log search (6 functions, internal/auditlog)
          #   - FP filters (4 functions, internal/detectors)
          #   - Normalization (2 functions, internal/detectors)
          #   - Certificate loading (1 function, internal/certificate)
          #   - Proxy helpers (3 functions, pkg/proxy)
          #   - Enterprise config (1 function, internal/enterprise)
          #   - Webhook validation (1 function, internal/webhook)
          #   - Metrics hashing (1 function, internal/metrics)
          #   - Integrity verification (1 function, internal/integrity)
          #   - Detector educational FP (1 function, pkg/detector)
          #   - Lens correlation (1 function, pkg/lenscorrelation)
          # Target: 90% — remaining gap requires HTTPS interception tests
          # (proxy.go interceptHTTPS) and ONNX model loading (CGO-gated).
          EXCLUDE_PKGS="github.com/aegisgatesecurity/aegisgate-rampart/cmd/rampart,github.com/aegisgatesecurity/aegisgate-rampart/internal/tray,github.com/aegisgatesecurity/aegisgate-rampart/cmd/rampart-lsp,github.com/aegisgatesecurity/aegisgate-rampart/internal/autostart,github.com/aegisgatesecurity/aegisgate-rampart/internal/catrust,github.com/aegisgatesecurity/aegisgate-rampart/internal/verify,github.com/aegisgatesecurity/aegisgate-rampart/internal/notify,github.com/aegisgatesecurity/aegisgate-rampart/internal/platform"
          
          # Generate coverage excluding untestable packages
          go test -coverprofile=coverage-filtered.out -covermode=atomic $(go list ./... | grep -v -E "$(echo $EXCLUDE_PKGS | sed 's/,/|/g')")
          TOTAL=$(go tool cover -func=coverage-filtered.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage (excluding untestable packages): ${TOTAL}%"
          PASS=$(echo "$TOTAL >= 85" | bc)
          if [ "$PASS" != "1" ]; then echo "FAIL: coverage ${TOTAL}% < 85%"; exit 1; fi
          
          # Also show full coverage for reference
          go test -coverprofile=coverage.out -covermode=atomic ./... 2>/dev/null || true
          FULL_TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Full coverage (all packages): ${FULL_TOTAL}%"
      - name: Check per-package coverage ≥ 85%
        run: |
          # Exempt packages that are inherently untestable in CI
          # (main entry points, GUI/system tray, platform-specific OS stubs)
          EXEMPT="cmd/rampart,internal/tray,cmd/rampart-lsp,internal/autostart,internal/catrust,internal/verify,internal/notify,internal/platform"
          go tool cover -func=coverage.out | grep -v total | while read pkg func cov; do
            PCT=$(echo "$cov" | tr -d '%')
            SKIP=0
            for e in $(echo "$EXEMPT" | tr ',' ' '); do
              if echo "$pkg" | grep -q "$e"; then SKIP=1; fi
            done
            if [ "$SKIP" = "0" ]; then
              PASS=$(echo "$PCT >= 85.0" | bc)
              if [ "$PASS" != "1" ]; then echo "LOW COV: $pkg $func ${PCT}%"; fi
            fi
          done
      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out

  # ========================================
  # Cross-compile — verify Windows + macOS builds
  # ========================================
  cross-compile:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Cross-compile for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart-windows.exe ./cmd/rampart/
          ls -lh rampart-windows.exe
      - name: Cross-compile for Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart-linux-arm64 ./cmd/rampart/
          ls -lh rampart-linux-arm64
      - name: Windows go vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: GOOS=windows GOARCH=amd64 go vet ./...

  # ========================================
  # macOS build + test — CGO_ENABLED=1 (systray requires Objective-C)
  # ========================================
  macos:
    needs: dco
    runs-on: macos-latest
    timeout-minutes: 35  # -race + expanded detector patterns on arm64 needs more headroom
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Run tests (CGO_ENABLED=1)
        run: CGO_ENABLED=1 go test -race -timeout 1800s -coverprofile=coverage.out ./...
      - name: go vet
        run: go vet ./...
      - name: Build binary (CGO_ENABLED=1)
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart ./cmd/rampart/
          ls -lh rampart
      - name: Verify binary runs
        run: ./rampart version

  # ========================================
  # Windows — build and vet (no CGO needed)
  # ========================================
  windows:
    needs: dco
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Run tests (CGO_ENABLED=0)
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Build binary
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart.exe ./cmd/rampart/
          ls rampart.exe
      - name: Verify binary runs
        run: .\rampart.exe version

  # ========================================
  # Build — verify binary compiles (pure Go, no CGO)
  # ORT EXCISED 2026-11-26 (user-approved): the CGO=1 matrix leg and the
  # dead ONNX Runtime download are removed. Neural ML is WITHDRAWN
  # (2026-11-23); if a future retrained model needs native inference it
  # must be Go-native per the Phase 4b constraint (no CGO, no vendored
  # native libs), which this matrix leg would not exercise anyway.
  # ========================================
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cgo: [0]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Build binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go build -ldflags "-s -w -X main.versionFlag=$(cat VERSION)" -o rampart ./cmd/rampart/
          ls -lh rampart
      - name: Verify binary runs
        run: ./rampart version

  # ========================================
  # ML tests — WITHDRAWN (2026-11-23)
  # Neural ML detection was withdrawn: the model was trained on a corrupted
  # corpus and is no longer shipped or downloaded anywhere. This job kept as
  # a passing stub (branch protection may require the check name); it runs no
  # ML code and downloads nothing. See docs/ML-WITHDRAWN.md.
  # To restore: revert this stub once a retrained, re-audited model lands.
  # ========================================
  ml-test:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: ML detection withdrawn
        run: |
          echo "Neural ML detection is WITHDRAWN (2026-11-23)."
          echo "No model is downloaded; no ML tests are run."
          echo "See docs/ML-WITHDRAWN.md for the withdrawal notice."
          exit 0