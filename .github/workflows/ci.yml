name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========================================
  # DCO enforcement — every commit must be signed off
  # ========================================
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: DCO Check
        uses: chrismwen/dco-action@v2

  # ========================================
  # Lint — golangci-lint + go vet + gofmt
  # ========================================
  lint:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "UNFORMATTED: $out"; exit 1; fi

  # ========================================
  # Test — unit tests + 80% coverage floor
  # ========================================
  test:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: Run tests (non-CGO)
        run: CGO_ENABLED=0 go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check total coverage ≥ 80%
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          PASS=$(echo "$TOTAL >= 80" | bc)
          if [ "$PASS" != "1" ]; then echo "FAIL: coverage ${TOTAL}% < 80%"; exit 1; fi
      - name: Check per-package coverage ≥ 80%
        run: |
          # Exempt packages that require integration tests or external deps
          EXEMPT="cmd/rampart,internal/certificate,internal/certinit,internal/ml,internal/logging,pkg/proxy,pkg/telemetry"
          go tool cover -func=coverage.out | grep -v total | while read pkg func cov; do
            PCT=$(echo "$cov" | tr -d '%')
            for e in $(echo "$EXEMPT" | tr ',' ' '); do
              if echo "$pkg" | grep -q "$e"; then continue 2; fi
            done
            PASS=$(echo "$PCT >= 80.0" | bc)
            if [ "$PASS" != "1" ]; then echo "LOW COV: $pkg $func ${PCT}%"; fi
          done
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ========================================
  # Build — verify binary compiles (both CGO and non-CGO)
  # ========================================
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cgo: [0, 1]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: Build binary
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go build -ldflags "-s -w -X main.version=$(cat VERSION)" -o rampart ./cmd/rampart/
          ls -lh rampart
      - name: Verify binary runs
        run: ./rampart version