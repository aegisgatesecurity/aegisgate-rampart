name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  # ========================================
  # Build binaries — Linux, Windows (CGO_ENABLED=0)
  # ========================================
  build-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: -arm64
          - goos: windows
            goarch: amd64
            suffix: -windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.versionFlag=$VERSION" \
            -o rampart${{ matrix.suffix }} ./cmd/rampart/
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rampart-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rampart${{ matrix.suffix }}

  # ========================================
  # Build binaries — macOS (CGO_ENABLED=1, needs Xcode)
  # fyne.io/systray uses Objective-C on macOS, requiring CGO.
  # ========================================
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: -macos-amd64
          - goarch: arm64
            suffix: -macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.versionFlag=$VERSION" \
            -o rampart${{ matrix.suffix }} ./cmd/rampart/
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rampart-darwin-${{ matrix.goarch }}
          path: rampart${{ matrix.suffix }}

  # ========================================
  # Keyless signing — Sigstore/Cosign
  # ========================================
  sign-binary:
    needs: [build-static, build-macos]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: rampart-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Sign binary (keyless)
        run: |
          cosign sign-blob --yes rampart* \
            --certificate rampart.cert \
            --signature rampart.sig
      - name: Upload signature
        uses: actions/upload-artifact@v4
        with:
          name: rampart-${{ matrix.goos }}-${{ matrix.goarch }}-sig
          path: |
            rampart.cert
            rampart.sig

  # ========================================
  # SBOM — CycloneDX + SPDX (Syft)
  # ========================================
  sbom-attest:
    needs: [build-static, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx
          output-file: sbom-cyclonedx.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom-spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

  # ========================================
  # Docker build + push
  # ========================================
  build-container:
    needs: [build-static, sign-binary]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: rampart-linux-amd64
          path: build/
      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: rampart-linux-arm64
          path: build/
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}
          platforms: linux/amd64,linux/arm64
      - name: Sign container image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}

  # ========================================
  # GitHub Release
  # ========================================
  create-release:
    needs: [build-static, build-macos, sign-binary, sbom-attest, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            release/rampart-linux-amd64/*
            release/rampart-linux-arm64/*
            release/rampart-darwin-amd64/*
            release/rampart-darwin-arm64/*
            release/rampart-windows-amd64/*
            release/sbom/*