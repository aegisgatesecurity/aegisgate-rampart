name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

jobs:
  # ========================================
  # Build binaries — Windows (CGO_ENABLED=0, no ONNX runtime)
  # Windows standalone binary uses heuristic-only ML detection.
  # ========================================
  build-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: -windows.exe
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.versionFlag=$VERSION" \
            -o rampart${{ matrix.suffix }} ./cmd/rampart/
      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rampart-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rampart${{ matrix.suffix }}

  # ========================================
  # Build binaries — Linux (CGO_ENABLED=0, pure Go)
  # ORT EXCISED 2026-11-26 (user-approved): the dead ONNX Runtime download
  # is removed; the build is pure Go. Neural ML detection is WITHDRAWN
  # (2026-11-23); job name/artifact kept so the release pipeline and
  # branch protection are unchanged.
  # ========================================
  build-ml:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.versionFlag=$VERSION" \
            -o rampart${{ matrix.suffix }} ./cmd/rampart/
      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rampart-linux-${{ matrix.goarch }}
          path: rampart${{ matrix.suffix }}

  # ========================================
  # Build binary — Linux ARM64 (CGO_ENABLED=0, heuristic-only)
  # Cross-compiling CGO for arm64 on x86 requires a full cross-toolchain
  # and arm64 ONNX runtime libs. The Docker image handles arm64 ML via
  # QEMU emulation in buildx. The standalone arm64 binary uses heuristics.
  # ========================================
  build-static-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.versionFlag=$VERSION" \
            -o rampart-arm64 ./cmd/rampart/
      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rampart-linux-arm64
          path: rampart-arm64

  # ========================================
  # Build binaries — macOS (CGO_ENABLED=1, needs Xcode)
  # fyne.io/systray uses Objective-C on macOS, requiring CGO.
  # ========================================
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: -macos-amd64
          - goarch: arm64
            suffix: -macos-arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          go build -ldflags "-s -w -X main.versionFlag=$VERSION" \
            -o rampart${{ matrix.suffix }} ./cmd/rampart/
      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rampart-darwin-${{ matrix.goarch }}
          path: rampart${{ matrix.suffix }}

  # ========================================
  # Keyless signing — Sigstore/Cosign
  # Requires id-token: write for OIDC-based keyless signing
  # ========================================
  sign-binary:
    needs: [build-static, build-ml, build-static-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Download binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: rampart-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Sign binary (keyless)
        run: |
          for f in rampart*; do
            cosign sign-blob --yes "$f" \
              --bundle "$f.cosign.bundle"
          done
      - name: Upload signature
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rampart-${{ matrix.goos }}-${{ matrix.goarch }}-sig
          path: |
            rampart*.cosign.bundle

  # ========================================
  # SBOM — CycloneDX + SPDX (Syft)
  # ========================================
  sbom-attest:
    needs: [build-static, build-ml, build-static-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          format: cyclonedx
          output-file: sbom-cyclonedx.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          format: spdx-json
          output-file: sbom-spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

  # ========================================
  # Docker build + push (builds from source with CGO + ONNX Runtime)
  # ========================================
  build-container:
    needs: [build-ml, build-static-arm64, sign-binary]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ML model — WITHDRAWN (2026-11-23)
        run: |
          # Neural ML detection was withdrawn 2026-11-23 (see docs/ML-WITHDRAWN.md).
          # The poisoned model is no longer published or downloaded. The image
          # ships without it; the container runs deterministic detection only.
          echo "ML model withdrawn 2026-11-23 — building without neural model"
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}
          platforms: linux/amd64
      - name: Sign container image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.event.inputs.version || github.ref_name }}

  # ========================================
  # GitHub Release
  # ========================================
  create-release:
    needs: [build-static, build-ml, build-static-arm64, build-macos, sign-binary, sbom-attest, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download binary artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: rampart-*
          path: release/
      - name: Download SBOM
        uses: actions/download-artifact@v8.0.2
        with:
          name: sbom
          path: release/sbom
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/rampart-linux-amd64/*
            release/rampart-linux-arm64/*
            release/rampart-darwin-amd64/*
            release/rampart-darwin-arm64/*
            release/rampart-windows-amd64/*
            release/rampart-linux-amd64-sig/*
            release/rampart-linux-arm64-sig/*
            release/rampart-darwin-amd64-sig/*
            release/rampart-darwin-arm64-sig/*
            release/rampart-windows-amd64-sig/*
            release/sbom/*