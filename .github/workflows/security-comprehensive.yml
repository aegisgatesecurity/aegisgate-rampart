name: Security Comprehensive

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM
  workflow_dispatch:
    inputs:
      run_dast:
        description: 'Run DAST scans (ZAP)'
        required: false
        default: 'true'
        type: boolean
      run_pentest:
        description: 'Run pentest simulations'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ========================================
  # Semgrep — multi-language SAST
  # (returntocorp/semgrep-action is deprecated/archived — use direct CLI)
  # ========================================
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install Semgrep
        run: pipx install semgrep && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Semgrep Scan
        run: |
          if [ -f .semgrep.yml ]; then
            semgrep scan --config .semgrep.yml --sarif --output semgrep-results.sarif || true
          else
            semgrep scan --config auto --sarif --output semgrep-results.sarif || true
          fi
        continue-on-error: true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: semgrep-results.sarif

  # ========================================
  # Go Fuzzing — native fuzz targets
  # ========================================
  fuzz-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Fuzz config parser
        run: |
          go test -fuzz=FuzzParseConfig -fuzztime=60s ./pkg/config/
      - name: Fuzz scan request
        run: |
          go test -fuzz=FuzzScanRequest -fuzztime=60s ./pkg/detector/

  # ========================================
  # OWASP ZAP — DAST against Rampart API
  # ========================================
  zap-scan:
    if: ${{ github.event.inputs.run_dast == 'true' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Build Rampart
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.versionFlag=dev" -o rampart ./cmd/rampart/
      - name: Start Rampart
        run: |
          ./rampart --port 8080 &
          sleep 5
          # Wait for proxy to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Rampart is ready"
              break
            fi
            echo "Waiting for Rampart... ($i/30)"
            sleep 1
          done
          # Verify it's actually up
          if ! curl -s http://localhost:8080/health > /dev/null 2>&1; then
            echo "Rampart failed to start — skipping ZAP scan"
            exit 0
          fi
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
        continue-on-error: true
      - name: ZAP API Scan — /detect
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080'
          format: 'openapi'
          docker_name: 'ghcr.io/zaproxy/zaproxy:latest'
        continue-on-error: true

  # ========================================
  # Security summary
  # ========================================
  security-summary:
    needs: [semgrep, fuzz-config, zap-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Comprehensive Security Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| semgrep | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| fuzz-config | ${{ needs.fuzz-config.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| zap-scan | ${{ needs.zap-scan.result }} |" >> $GITHUB_STEP_SUMMARY