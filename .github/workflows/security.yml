name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ========================================
  # Go vulnerability check
  # ========================================
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ========================================
  # Gosec — Go SAST
  # ========================================
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: Run Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # Exclude false-positive rules:
          # G304: file inclusion via config paths (validated, not user input)
          # G301/G302/G306: file/dir permissions (intentional for system files)
          # G204: subprocess with variable (Go exec.Command has no shell)
          # G103: unsafe pointer (securemem — intentional memory wiping)
          # G117/G118: implicit memory aliasing (false positives)
          # G112: slowloris (pprof is localhost-only, behind config flag)
          # G402: TLS skip verify (user-configured for webhook endpoints)
          # G703: env var path (standard ML library path config)
          # G704/G706: defer close (handled by golangci-lint errcheck)
          gosec -no-fail -fmt sarif -out gosec.sarif -exclude-generated \
            -exclude G103,G117,G118,G112,G204,G301,G302,G304,G306,G402,G703,G704,G706 \
            ./... || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always() && github.repository_visibility != 'private'
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  # ========================================
  # Trivy — filesystem + container scanning
  # ========================================
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build binary for scanning
        run: |
          CGO_ENABLED=0 go build -o rampart ./cmd/rampart/
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

  # ========================================
  # Gitleaks — secret detection (git history)
  # ========================================
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          chmod +x gitleaks
          mv gitleaks /usr/local/bin/
      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --config .gitleaks.toml --verbose --report-format sarif --report-path gitleaks.sarif || true
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always() && github.repository_visibility != 'private'
        with:
          sarif_file: gitleaks.sarif
        continue-on-error: true

  # ========================================
  # TruffleHog — verified secret detection
  # ========================================
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          extra_args: '--only-verified'

  # ========================================
  # Standard Go tools — go vet, staticcheck, gofmt
  # ========================================
  standard-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "UNFORMATTED: $out"; exit 1; fi

  # ========================================
  # SBOM — CycloneDX + SPDX
  # ========================================
  sbom:
    needs: [govulncheck, gosec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          format: cyclonedx
          output-file: sbom-cyclonedx.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          format: spdx-json
          output-file: sbom-spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

  # ========================================
  # Security summary
  # ========================================
  security-summary:
    needs: [govulncheck, gosec, trivy, gitleaks, trufflehog, standard-tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| govulncheck | ${{ needs.govulncheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gosec | ${{ needs.gosec.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| trivy | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| trufflehog | ${{ needs.trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY