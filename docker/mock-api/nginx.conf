# Mock AI API endpoints for development testing
# This simulates various AI API endpoints for local Rampart testing

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # OpenAI API endpoint simulation
    server {
        listen 80;
        server_name api.openai.com localhost;

        location /v1/chat/completions {
            default_type application/json;
            return 200 '{
                "id": "chatcmpl-mock-123",
                "object": "chat.completion",
                "created": 1234567890,
                "model": "gpt-4-mock",
                "choices": [{
                    "index": 0,
                    "message": {
                        "role": "assistant",
                        "content": "This is a mock response from OpenAI API for development testing."
                    },
                    "finish_reason": "stop"
                }],
                "usage": {
                    "prompt_tokens": 10,
                    "completion_tokens": 20,
                    "total_tokens": 30
                }
            }';
        }

        location /v1/completions {
            default_type application/json;
            return 200 '{
                "id": "cmpl-mock-456",
                "object": "text_completion",
                "created": 1234567890,
                "model": "text-davinci-003-mock",
                "choices": [{
                    "text": "This is a mock completion response.",
                    "index": 0,
                    "finish_reason": "stop"
                }]
            }';
        }

        location / {
            default_type application/json;
            return 404 '{"error": "Mock endpoint not found"}';
        }
    }

    # Anthropic API endpoint simulation
    server {
        listen 80;
        server_name api.anthropic.com;

        location /v1/complete {
            default_type application/json;
            return 200 '{
                "completion": "This is a mock response from Anthropic API.",
                "model": "claude-2-mock",
                "stop_reason": "end_turn"
            }';
        }

        location / {
            default_type application/json;
            return 404 '{"error": "Mock endpoint not found"}';
        }
    }

    # Google AI API endpoint simulation
    server {
        listen 80;
        server_name generativelanguage.googleapis.com;

        location /v1/models/gemini-pro:generateContent {
            default_type application/json;
            return 200 '{
                "candidates": [{
                    "content": {
                        "parts": [{
                            "text": "This is a mock response from Google AI API."
                        }]
                    },
                    "finishReason": "STOP"
                }],
                "usageMetadata": {
                    "promptTokenCount": 10,
                    "candidatesTokenCount": 20,
                    "totalTokenCount": 30
                }
            }';
        }

        location / {
            default_type application/json;
            return 404 '{"error": "Mock endpoint not found"}';
        }
    }
}
